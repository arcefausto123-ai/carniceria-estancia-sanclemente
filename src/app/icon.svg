  <rect width="64" height="64" rx="12" fill="#0f2b4c"/>
  <circle cx="7" cy="32" r="2" fill="#fdfbf7"/>
  <circle cx="57" cy="32" r="2" fill="#fdfbf7"/>
  <text x="32" y="30" text-anchor="middle" fill="#fdfbf7"
        font-family="Georgia, serif" font-size="15" font-weight="700"
        letter-spacing="1">ESC</text>
  <text x="32" y="44" text-anchor="middle" fill="#fdfbf7"
